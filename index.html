<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1614"><title>Les villages ukrainiens — Présentation</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#0e1614;--white:#f5f2e9;--gold:#e6c99b;--muted:#d4d5ce}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:Manrope,'Segoe UI',sans-serif}button{font:inherit}.slide{position:absolute;inset:0;display:grid;grid-template-columns:47% 53%;opacity:0;visibility:hidden;transform:translateY(14px) scale(1.012);transition:opacity .65s ease,transform .8s cubic-bezier(.2,.7,.1,1),visibility .65s}.slide.active{opacity:1;visibility:visible;transform:none}.slide.hero{display:block}.visual{position:relative;overflow:hidden;background:linear-gradient(135deg,#293d34,#151e1a)}.photo{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);transition:transform 8s ease;filter:saturate(.82) contrast(1.04)}.active .photo{transform:scale(1)}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,18,14,.1),rgba(8,18,14,.12))}.hero .visual{position:absolute;inset:0}.hero .visual:after{background:linear-gradient(90deg,rgba(8,18,14,.84) 0%,rgba(8,18,14,.5) 48%,rgba(8,18,14,.08) 100%),linear-gradient(0deg,rgba(8,18,14,.38),transparent 35%)}.content{display:flex;flex-direction:column;justify-content:center;padding:8vw 7.5vw 8vw 8vw;position:relative;z-index:2;background:#111d19}.hero .content{position:absolute;inset:0;background:none;max-width:1100px;padding:10vw}.eyebrow{font-size:clamp(10px,1vw,14px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:28px}.title{font-size:clamp(42px,5.4vw,92px);font-weight:700;letter-spacing:-.065em;line-height:1.07;margin:0;max-width:850px}.hero .title{font-size:clamp(54px,7vw,112px)}.subtitle{font-size:clamp(18px,2vw,29px);line-height:1.52;color:#e0e2d9;max-width:580px;margin:32px 0 0;font-weight:400}.rule{height:3px;width:70px;background:var(--gold);margin-top:38px}.slide:not(.active) .eyebrow,.slide:not(.active) .title,.slide:not(.active) .subtitle{opacity:0;transform:translateY(16px)}.active .eyebrow,.active .title,.active .subtitle{animation:rise .85s both}.active .title{animation-delay:.12s}.active .subtitle{animation-delay:.25s}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.top{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:28px 44px;pointer-events:none}.logo{font-size:11px;letter-spacing:.22em;font-weight:800;color:#fff}.logo i{color:var(--gold);font-style:normal}.top small{font-size:11px;letter-spacing:.1em;color:#e8e8de}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:24px 44px;background:linear-gradient(0deg,rgba(6,12,10,.55),transparent);pointer-events:none}.credit{font-size:10px;max-width:50vw;color:#d4d7cf;opacity:.78}.nav{display:flex;align-items:center;gap:18px;pointer-events:auto}.counter{font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:.1em;color:#eee}.nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.23);color:white;width:40px;height:40px;border-radius:50%;cursor:pointer;transition:background .2s}.nav button:hover{background:rgba(255,255,255,.3)}.progress{position:fixed;bottom:0;left:0;height:3px;background:var(--gold);z-index:12;transition:width .5s}.badge{display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border:1px solid #d2bc92;border-radius:30px;color:#e8d6b4;margin-top:32px;width:max-content;font-size:13px}.nastashka .visual{background:radial-gradient(circle at 50% 50%,#304b3e,#14231c)}.nastashka .photo{background-size:contain;background-repeat:no-repeat;background-position:center;inset:18%;filter:none}.nastashka .visual:after{background:none}.hint{position:fixed;right:45px;top:76px;font-size:10px;opacity:.5;z-index:10}@media(max-width:700px){.slide{grid-template-columns:1fr;grid-template-rows:48% 52%}.content{padding:8vw}.title{font-size:clamp(34px,8vw,56px)}.hero .title{font-size:clamp(48px,11vw,74px)}.hero .content{padding:10vw}.subtitle{font-size:17px;margin-top:18px}.eyebrow{margin-bottom:16px}.top{padding:18px}.top small{display:none}.bottom{padding:15px}.credit{font-size:8px;max-width:52vw}.hint{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<style>
:root{--gold:#e6c99b}
body{background:#101814}
.slide{grid-template-columns:52% 48%;transition:opacity .85s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1),visibility .85s}
.slide:not(.hero) .visual{grid-column:1;grid-row:1}
.slide:not(.hero) .content{grid-column:2;grid-row:1}
.slide:nth-child(3):not(.hero) .visual,.slide:nth-child(5):not(.hero) .visual,.slide:nth-child(7):not(.hero) .visual{grid-column:2}
.slide:nth-child(3):not(.hero) .content,.slide:nth-child(5):not(.hero) .content,.slide:nth-child(7):not(.hero) .content{grid-column:1}
.content{background:linear-gradient(135deg,#16251f,#0d1714);padding:8vw 5vw 8vw 6vw}
.hero .content{max-width:1250px}
.hero .visual:after{background:linear-gradient(90deg,rgba(6,16,12,.88),rgba(6,16,12,.35) 65%,rgba(6,16,12,.08))}
.photo{background-color:#253d30;filter:saturate(.9) contrast(1.07)}
.slide.active .photo{animation:slowPan 18s ease-out both}
@keyframes slowPan{from{transform:scale(1.12) translateX(-1%)}to{transform:scale(1.025) translateX(1%)}}
.slide .rule{transition:width 1s ease .3s;width:0}
.slide.active .rule{width:74px}
.title{font-weight:700;letter-spacing:-.055em}
.eyebrow{letter-spacing:.19em}
.top{padding:22px 38px}
.top .logo{background:rgba(13,25,19,.38);padding:11px 15px;border-radius:99px;backdrop-filter:blur(10px)}
.top small{display:none}
.bottom{padding:18px 38px}
#presentationDate{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:15;color:#eee6d7;font-size:11px;letter-spacing:.17em;font-weight:600;text-shadow:0 2px 8px #0008;pointer-events:none}
#fullBtn{position:fixed;right:37px;top:23px;z-index:25;background:#ffffff18;border:1px solid #ffffff40;border-radius:50%;width:43px;height:43px;color:white;cursor:pointer;font-size:18px;backdrop-filter:blur(10px)}
#fullBtn:hover{background:#ffffff33}
body.presentation-mode .top,body.presentation-mode .bottom,body.presentation-mode .hint,body.presentation-mode #fullBtn{opacity:0;pointer-events:none}
body.presentation-mode #presentationDate{bottom:23px;opacity:.75}
body.presentation-mode .progress{height:2px;opacity:.7}
#imageStatus{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:40;background:#1a2a23;color:white;border:1px solid #e6c99b66;border-radius:12px;padding:9px 14px;font-size:12px;display:none}

@media(max-width:700px){.slide{grid-template-columns:1fr;grid-template-rows:48% 52%}.slide:not(.hero) .visual,.slide:nth-child(3):not(.hero) .visual,.slide:nth-child(5):not(.hero) .visual,.slide:nth-child(7):not(.hero) .visual{grid-column:1;grid-row:1}.slide:not(.hero) .content,.slide:nth-child(3):not(.hero) .content,.slide:nth-child(5):not(.hero) .content,.slide:nth-child(7):not(.hero) .content{grid-column:1;grid-row:2}.content{padding:8vw}#presentationDate{left:20px;bottom:12px;transform:none;font-size:9px}#fullBtn{right:18px;top:15px}}
</style>
</head><body><div class="top"><div class="logo">UKRAINE <i>/</i> VILLAGES</div><small>UNE PRÉSENTATION EN FRANÇAIS</small></div><div class="hint">← → pour naviguer · F pour plein écran</div><main id="deck"></main><button id="fullBtn" aria-label="Plein écran" title="Plein écran (F)">⛶</button><div id="presentationDate">04 NOVEMBRE 2026 · UKRAINE</div><div id="imageStatus"></div><footer class="bottom"><div class="credit" id="credit"></div><div class="nav"><span class="counter" id="count"></span><button id="prev" aria-label="Précédent">←</button><button id="next" aria-label="Suivant">→</button></div></footer><div class="progress" id="progress"></div><script>
const slides=[{"k": "INTRODUCTION", "title": "La vie dans les villages ukrainiens", "subtitle": "Une autre façon de découvrir mon pays.", "photo": 0, "layout": "hero", "eyebrow": "Culture · Nature · Traditions", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Khata%20%28Ukrainian%20traditional%20house%29.jpg?width=1800", "credit": "Maison traditionnelle — Wikimedia Commons"}, {"k": "01 / LES PAYSAGES", "title": "La nature, partout.", "subtitle": "Des champs, des jardins, des forêts et des rivières.", "photo": 1, "layout": "split", "eyebrow": "L’espace et le calme", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/%D0%9E%D0%BA%D0%BE%D0%BB%D0%B8%D1%86%D1%8F%20%D1%81%D0%B5%D0%BB%D0%B0%20%D0%A5%D0%B0%D1%80%D0%B8%D1%82%D0%BE%D0%BD%D1%96%D0%B2%D0%BA%D0%B0.jpg?width=1800", "credit": "Paysage rural — Kharytonivka, Wikimedia Commons"}, {"k": "02 / LES MAISONS", "title": "Des maisons avec une histoire.", "subtitle": "Des murs blancs, des toits traditionnels et des jardins.", "photo": 3, "layout": "split", "eyebrow": "Le patrimoine", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/2019-07-18%20Museum%20of%20Folk%20Architecture%20and%20Ethnography%20in%20Pyrohiv%2003.jpg?width=1800", "credit": "Architecture traditionnelle — musée de Pyrohiv, Wikimedia Commons"}, {"k": "03 / LE QUOTIDIEN", "title": "Une vie simple et active.", "subtitle": "Le jardin, les animaux, la famille et les voisins.", "photo": 2, "layout": "split", "eyebrow": "La vie de tous les jours", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A1%D1%96%D0%BB%D1%8C%D1%81%D1%8C%D0%BA%D0%B0%20%D0%B2%D1%83%D0%BB%D0%B8%D1%86%D1%8F%20%28%D0%9D%D0%BE%D0%B2%D0%BE%D0%BF%D0%B5%D1%82%D1%80%D1%96%D0%B2%D1%81%D1%8C%D0%BA%D0%B5%29.jpg?width=1800", "credit": "Rue de village — Novopetrivske, Wikimedia Commons"}, {"k": "04 / LES TRADITIONS", "title": "Des traditions qui restent.", "subtitle": "La cuisine, les fêtes et les moments en famille.", "photo": 5, "layout": "split", "eyebrow": "La culture ukrainienne", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A3%D0%BA%D1%80%D0%B0%D1%97%D0%BD%D1%81%D1%8C%D0%BA%D0%B8%D0%B9%20%D0%B4%D0%B2%D1%96%D1%80.jpg?width=1800", "credit": "Cour ukrainienne — Wikimedia Commons"}, {"k": "05 / UN VILLAGE", "title": "Nastashka.", "subtitle": "Un village de la région de Kyiv, en Ukraine.", "photo": 7, "layout": "nastashka", "eyebrow": "Un exemple personnel", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Nastashka%20gerb.png?width=1800", "credit": "Armoiries de Nastashka — Wikimedia Commons"}, {"k": "06 / AUJOURD’HUI", "title": "Le calme, mais aussi des défis.", "subtitle": "La nature est proche. Les transports et les services sont parfois plus loin.", "photo": 6, "layout": "split", "eyebrow": "Les avantages et les difficultés", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A1%D0%B0%D0%B4%D0%B8%D0%B1%D0%B8%20%D0%B2%20%D0%AF%D0%BD%D0%BE%D0%BF%D0%BE%D0%BB%D1%96%20%28%D0%A0%D1%83%D0%B1%D0%B0%D0%BD%D0%B8%D0%B9%20%D0%9C%D1%96%D1%81%D1%82%29.jpg?width=1800", "credit": "Maisons de village — Yanopil, Wikimedia Commons"}, {"k": "CONCLUSION", "title": "Une histoire à partager.", "subtitle": "Les villages font partie de la culture et de l’histoire de l’Ukraine.", "photo": 4, "layout": "hero", "eyebrow": "Merci pour votre attention !", "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Traditional%20houses%20in%20Tokari%20Sumy%20Oblast%20Ukraine%20by%20baby-bear.org.jpg%2008.jpg?width=1800", "credit": "Maisons à Tokari — Wikimedia Commons"}];let current=0;const deck=document.getElementById('deck');
slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+s.layout;el.setAttribute('aria-label','Diapositive '+(i+1));const badge=s.layout==='nastashka'?'<div class="badge">Région de Kyiv · Ukraine</div>':'';el.innerHTML=`<div class="visual"><div class="photo" style="background-image:url('${s.image}')"></div></div><div class="content"><div class="eyebrow">${s.k} — ${s.eyebrow}</div><h1 class="title">${s.title}</h1><div class="rule"></div><p class="subtitle">${s.subtitle}</p>${badge}</div>`;deck.appendChild(el)});
function show(n){current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===current));document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');document.getElementById('credit').textContent='PHOTO · '+slides[current].credit+(current===5?' · armoiries, pas une photographie du village':'');document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%'}document.getElementById('next').onclick=()=>show(current+1);document.getElementById('prev').onclick=()=>show(current-1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')show(current+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(current-1);if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}});let startX=0;document.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>70)show(current+(d<0?1:-1))},{passive:true});show(0);

const fullBtn=document.getElementById('fullBtn');
const enterFull=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){document.body.classList.toggle('presentation-mode')}};
fullBtn.addEventListener('click',enterFull);
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('presentation-mode',!!document.fullscreenElement));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)document.body.classList.remove('presentation-mode');if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
const fallbackArt=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#5f837d"/><stop offset=".55" stop-color="#d6c49b"/><stop offset="1" stop-color="#a8a16b"/></linearGradient><linearGradient id="field" x2="0" y2="1"><stop stop-color="#8f9e6b"/><stop offset="1" stop-color="#314d37"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#sky)"/><circle cx="1170" cy="270" r="105" fill="#ffe4a5" opacity=".65"/><path d="M0 610 Q350 510 710 605 T1600 570 V1000 H0Z" fill="#789172"/><path d="M0 750 Q400 640 800 720 T1600 660 V1000 H0Z" fill="url(#field)"/><path d="M380 660 V510 L580 390 L780 515 V660Z" fill="#d4cbb0"/><path d="M340 520 L580 365 L825 520" stroke="#594a3b" stroke-width="40" fill="none"/><rect x="540" y="550" width="75" height="110" fill="#5b604d"/><rect x="425" y="545" width="60" height="55" fill="#536f69"/><path d="M0 845 Q420 770 800 865 T1600 800" fill="none" stroke="#e2cb91" stroke-width="11" opacity=".45"/><g fill="#253f31"><circle cx="1030" cy="560" r="105"/><circle cx="1140" cy="590" r="95"/><rect x="1070" y="600" width="28" height="200"/></g></svg>`;
const fallbackUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(fallbackArt);
document.querySelectorAll('.photo').forEach((el,i)=>{
 const src=slides[i].image; const probe=new Image();
 probe.onerror=()=>{el.style.backgroundImage=`url("${fallbackUrl}")`;el.dataset.fallback='true'};
 probe.src=src;
});
</script></body></html>
